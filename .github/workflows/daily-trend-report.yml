name: Daily Jewelry Trend Report

on:
  schedule:
    # 12:00 UTC = 08:00 New York (EDT, UTC-4).
    # Kasım-Mart arası (EST, UTC-5) saat değişince "0 13 * * *" yap.
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # Manuel tetikleme için (test amaçlı)

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run trend report script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_trend_report.py
